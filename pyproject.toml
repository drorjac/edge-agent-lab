[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent-lab"
version = "0.1.0"
description = "Reproducible sensor ML, data stewardship agents, and edge optimization experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "torch==2.2.2", "scikit-learn>=1.5,<1.7",
  "filelock>=3.13", "matplotlib>=3.8,<3.11", "pydantic>=2,<3", "pyyaml>=6",
]

[project.optional-dependencies]
local-llm = ["llama-cpp-python==0.3.9"]
apple = ["coremltools==8.3.0", "setuptools==75.8.2"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
edge-lab = "edge_agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
edge_agent_lab = ["templates/*.html"]
